<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light to Dark mode</title>
    <style>
        h1 {
            text-align: center;
        }
        body {
            position: relative;
            isolation: isolate;
            min-height: 100vh;
            margin: 0;
            padding-top: 1px;
            background-color: white;
            color: black;
            transition: background-color 1s, color 1s;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0;
            background: linear-gradient(
                120deg,
                #ff0000,
                #ff8c00,
                #ffff00,
                #00c853,
                #00b0ff,
                #651fff,
                #d500f9,
                #ff0000
            );
            background-size: 400% 400%;
            transition: opacity 1s ease;
            animation: rainbow 8s ease infinite;
        }
        .dark-mode {
            background-color: black;
            color: white;
        }
        .light-mode {
            background-color: white;
            color: black;
        }
        .rainbow-mode {
            color: white;
            background-color: #651fff;
        }
        .rainbow-mode::before {
            opacity: 1;
        }
        .rainbow-mode h1 {
            background: linear-gradient(
                120deg,
                #ff0000,
                #ff8c00,
                #ffff00,
                #00c853,
                #00b0ff,
                #651fff,
                #d500f9,
                #ff0000
            );
            background-size: 400% 400%;
            background-position: 100% 50%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: rainbow-text 8s ease-in-out infinite;
        }
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes rainbow-text {
            0% { background-position: 100% 50%; }
            50% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        button {
            background-color: black;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            transition: 1s;
            text-align: center;
        }
        .rainbow-mode button {
            background: linear-gradient(
                120deg,
                #ff0000,
                #ff8c00,
                #ffff00,
                #00c853,
                #00b0ff,
                #651fff,
                #d500f9,
                #ff0000
            );
            background-size: 400% 400%;
            animation: rainbow-button 8s ease-in-out infinite;
        }
        @keyframes rainbow-button {
            0% { background-position: 100% 50%; }
            50% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        @media (prefers-reduced-motion: reduce) {
            body,
            body::before,
            .rainbow-mode h1,
            .rainbow-mode button {
                transition-duration: 1ms;
                animation: none;
            }
        }
    </style>
</head>
<body id="body">
    <h1 id="mode">Light Mode</h1>
    
    <center>
        <button id="button"><i class="fa fa-lightbulb-o" aria-hidden="true"></i>LIGHTS OFF!</button>
    </center>

    <script>
        var currentMode = 0;
        var body = document.getElementById('body');
        var mode = document.getElementById('mode');
        var button = document.getElementById('button');
        var themes = [
            { className: 'dark-mode', label: 'Dark Mode', buttonLabel: 'RAINBOW MODE!' },
            { className: 'rainbow-mode', label: 'Rainbow Mode', buttonLabel: 'LIGHTS ON!' },
            { className: 'light-mode', label: 'Light Mode', buttonLabel: 'LIGHTS OFF!' }
        ];

        function changeTheme() {
            currentMode = (currentMode + 1) % themes.length;
            var theme = themes[currentMode];

            body.classList.remove('light-mode', 'dark-mode', 'rainbow-mode');
            body.classList.add(theme.className);
            mode.textContent = theme.label;
            button.textContent = theme.buttonLabel;
        }

        button.addEventListener('click', changeTheme);
    </script>
</body> 
</html>
